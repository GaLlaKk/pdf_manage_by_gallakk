name: Build and release PDF Manager

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install application and packaging dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m pytest -q test_pdf_manager_service.py

      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDFManager --collect-all tkinterdnd2 --collect-all pymupdf pdf_manager.py

      - name: Package application
        run: python scripts/package_release.py --platform "${{ matrix.platform }}" --architecture "${{ runner.arch }}"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: PDFManager-${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: PDFManager-*
          merge-multiple: true

      - name: Publish packages on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --title "PDF Manager $RELEASE_TAG" \
              --generate-notes
          fi
