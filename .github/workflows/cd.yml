name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tagged commit belongs to main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME doit pointer sur un commit de main."
            exit 1
          fi

  test:
    name: Run tests
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build standalone application
        run: python scripts/build_application.py --version "${{ github.ref_name }}"

      - name: Package application
        run: python scripts/package_release.py --platform "${{ matrix.platform }}" --architecture "${{ runner.arch }}"

      - name: Upload platform package
        uses: actions/upload-artifact@v7
        with:
          name: PDFManager-${{ matrix.platform }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: PDFManager-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Publish packages on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::La release $RELEASE_TAG est déjà publiée (immuable) : impossible d'y ajouter les packages."
              echo "::error::Supprimez-la, puis poussez un nouveau tag (ne créez pas la release à la main)."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
              --draft \
              --title "PDF Manager $RELEASE_TAG" \
              --generate-notes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
